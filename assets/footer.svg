<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="ft fd">
  <title id="ft">Thanks for stopping by</title>
  <desc id="fd">A glowing sun with rays sets into the sea at dusk, under a thank-you message.</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055" />
      <stop offset="0.5" stop-color="#d76d77" />
      <stop offset="0.8" stop-color="#ffaf7b" />
    </linearGradient>
    <radialGradient id="sunF" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff7c2" /><stop offset="0.55" stop-color="#ffd23f" /><stop offset="1" stop-color="#ff7b29" />
    </radialGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.8" />
      <stop offset="0.6" stop-color="#ff8a3d" stop-opacity="0.25" />
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="seaF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c71" /><stop offset="1" stop-color="#140829" />
    </linearGradient>
    <clipPath id="skyOnly"><rect width="1200" height="210" /></clipPath>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a0a3a" flood-opacity="0.6" /></filter>
  </defs>

  <rect width="1200" height="280" fill="url(#dusk)" />

  <!-- Setting sun with turning rays. Its resting place is fully visible; the
       animation only adds a slow sink-and-rise on top. -->
  <g clip-path="url(#skyOnly)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 18; 0 0" dur="8s" repeatCount="indefinite" />
      <circle cx="600" cy="168" r="150" fill="url(#glowF)" />
      <g transform="translate(600 168)" stroke="#ffd23f" stroke-width="5" stroke-linecap="round" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite" additive="sum" />
        <line x1="0" y1="-78" x2="0" y2="-108" /><line x1="-78" y1="0" x2="-108" y2="0" /><line x1="78" y1="0" x2="108" y2="0" />
        <line x1="55" y1="-55" x2="76" y2="-76" /><line x1="-55" y1="-55" x2="-76" y2="-76" />
        <line x1="30" y1="-72" x2="41" y2="-100" /><line x1="-30" y1="-72" x2="-41" y2="-100" />
        <line x1="72" y1="-30" x2="100" y2="-41" /><line x1="-72" y1="-30" x2="-100" y2="-41" />
        <line x1="0" y1="78" x2="0" y2="108" /><line x1="55" y1="55" x2="76" y2="76" /><line x1="-55" y1="55" x2="-76" y2="76" />
      </g>
      <circle cx="600" cy="168" r="62" fill="url(#sunF)" />
    </g>
  </g>

  <!-- Sea, hills and the sun's reflection -->
  <rect y="210" width="1200" height="70" fill="url(#seaF)" />
  <path d="M0 210 Q 140 176 290 198 T 500 196 Q 540 192 555 210 Z" fill="#2a0f4a" opacity="0.9" />
  <path d="M645 210 Q 710 186 840 198 T 1070 190 Q 1150 186 1200 200 L1200 210 Z" fill="#2a0f4a" opacity="0.9" />
  <g fill="#ffd23f" opacity="0.85">
    <rect x="535" y="220" width="130" height="4" rx="2"><animate attributeName="width" values="130;96;130" dur="3s" repeatCount="indefinite" /></rect>
    <rect x="558" y="234" width="84" height="3" rx="1.5"><animate attributeName="x" values="558;570;558" dur="2.4s" repeatCount="indefinite" /></rect>
    <rect x="580" y="247" width="40" height="3" rx="1.5" />
  </g>

  <!-- Message -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" filter="url(#sh)">
    <text x="600" y="44" font-size="34" font-weight="800" fill="#ffffff">Thanks for stopping by ☀️</text>
    <text x="600" y="74" font-size="17" font-weight="600" fill="#fff4e0" letter-spacing="2">EVERY SUNSET IS A PROMISE OF A NEW SUNRISE  •  LET'S GROW SOMETHING TOGETHER</text>
  </g>
</svg>
