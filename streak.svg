  <g transform="translate(580 0)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.500;1" dur="1.60s" />
    <rect x="0" y="0" width="260" height="150" rx="18" fill="#1f1235" stroke="url(#edge)" stroke-width="2" />
    <text x="130" y="44" font-size="30" text-anchor="middle">📅</text>
    <text x="130" y="92" font-size="40" font-weight="800" text-anchor="middle" fill="url(#gold)">55</text>
    <text x="130" y="118" font-size="15" font-weight="700" text-anchor="middle" fill="#fff4e0">Active days</text>
    <text x="130" y="137" font-size="12" text-anchor="middle" fill="#d9c6ff">best day: 249 on 2026-11-22</text>
